name: Excavator

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  excavate:
    name: Auto-update Scoop manifests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Scoop Excavator
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: "1"
